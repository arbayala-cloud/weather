<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ashley's Weather</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2a0f3d"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Weather">
<style>
:root{--bg1:#2a0f3d;--bg2:#120818;--ink:#fff1de;--mut:#e8b98a;--card:#2b1438d9;--acc:#ff7a1a;--sun:#ffb627}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;overflow-x:hidden}
.app{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}header img{width:40px;height:40px;border-radius:12px;box-shadow:0 0 14px #ff7a1a66}
h1{color:#ffb35c;text-shadow:0 0 10px #ff7a1a88;font:600 22px/1.1 Georgia,"Times New Roman",serif;margin:0;flex:1;text-align:center}h1 small{display:block;font:13px -apple-system,system-ui,sans-serif;color:var(--mut);margin-top:3px}
.ib{background:#ff7a1a;color:#1c0b2b;border:0;border-radius:12px;padding:8px 11px;font:600 13px inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 4px #0001}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0006;border:1px solid #ff7a1a33;backdrop-filter:blur(6px)}
form{display:flex;gap:8px}input{flex:1;font-size:17px;padding:12px 14px;border:1.5px solid #8a4a1f;border-radius:14px;background:#1d0c27;color:var(--ink);min-width:0}input:focus{outline:2px solid var(--acc);border-color:transparent}
button.go{background:var(--acc);color:#fff;border:0;border-radius:14px;padding:0 18px;font:600 16px inherit;cursor:pointer}
.place{font-weight:600;font-size:16px}.upd{color:var(--mut);font-size:12px}
.now{display:flex;align-items:center;gap:12px}.now .big{font:300 72px/1 -apple-system,system-ui,sans-serif;letter-spacing:-2px}.now .ic{font-size:0}.now .ic svg{width:92px;height:92px}
.cond{font-size:18px;font-weight:600}.sub{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.grid div{background:#3a1b4a;border-radius:14px;padding:9px;text-align:center}.grid b{display:block;font-size:16px}.grid span{font-size:12px;color:var(--mut)}
h2{font:600 15px inherit;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.hours::-webkit-scrollbar{height:4px}.hours::-webkit-scrollbar-thumb{background:#ff7a1a;border-radius:4px}
.h{flex:0 0 64px;text-align:center;background:#3a1b4a;border-radius:14px;padding:8px 4px;scroll-snap-align:start}.h svg{width:32px;height:32px}.h b{display:block}.h small{color:var(--mut);font-size:11px;display:block}.h .rp{color:#a9c8ff}
.d{display:grid;grid-template-columns:54px 34px 44px 1fr;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #4a2a5a}.d:first-of-type{border-top:0}.d svg{width:30px;height:30px}.d .rp{color:#a9c8ff;font-size:12px}
.bar{position:relative;height:6px;border-radius:3px;background:#4a2a5a}.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#9a6bd6,#ffb627,#d9420f)}.rng{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}.rng span{color:var(--mut)}
.alert{background:#4a2410;color:#fff1de;border-left:5px solid #e8742a;border-radius:14px;padding:12px;margin:12px 0}.alert.sev{background:#5a1010;border-color:#ff4a3a}.alert b{display:block}.alert details{font-size:13px;color:#f3d6c0;margin-top:6px;white-space:pre-wrap}
.sun{display:flex;justify-content:space-around;text-align:center}.sun b{display:block;font-size:17px}
.locs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:12px 0 0}.locs:empty{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:#3a1b4a;border:1.5px solid #ff7a1a55;color:var(--ink);border-radius:14px;padding:7px 12px;cursor:pointer;font:inherit;min-width:92px;text-align:left}
.chip.on{background:linear-gradient(135deg,#ff7a1a,#d9420f);color:#1c0b2b;border-color:#ffb35c}.chip b{font-size:14px}.chip small{font-size:11px;opacity:.85}.chip .t{font-size:18px;font-weight:600}
.chip .def{display:inline-block;margin-left:4px;width:10px;height:10px;vertical-align:0}
.lhead{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.lhead h2{margin:0}.lk{background:none;border:0;color:var(--mut);font:600 12px inherit;cursor:pointer;text-decoration:underline}
.ed{display:flex;gap:4px;margin-top:6px}.ed button{background:#1d0c27;border:1px solid #8a4a1f;color:var(--ink);border-radius:8px;font:12px inherit;padding:3px 6px;cursor:pointer}.ed button.del{border-color:#ff4a3a;color:#ff9a7a}
.chip.on .ed button{background:#fff1de;color:#1c0b2b}
.savebtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#1d0c27;border:1.5px solid #ffb35c;color:#ffb35c;border-radius:12px;padding:6px 12px;font:600 13px inherit;cursor:pointer}.savebtn svg{width:18px;height:18px}.savebtn.saved{background:#ffb35c;color:#1c0b2b}
.picks{display:flex;flex-direction:column;gap:8px}.pickb{display:flex;flex-direction:column;align-items:flex-start;background:#3a1b4a;border:1.5px solid #ff7a1a55;color:var(--ink);border-radius:14px;padding:10px 14px;font:inherit;cursor:pointer;text-align:left}.pickb b{font-size:16px}.pickb small{color:var(--mut);font-size:12px}.pickb:active{background:#ff7a1a;color:#1c0b2b}
.msg{text-align:center;color:var(--mut);padding:20px}.err{color:#ff9a7a}
.foot{text-align:center;font-size:11px;color:var(--mut);margin-top:18px}.foot a{color:inherit}
#inst[hidden],[hidden]{display:none!important}#ihelp{font-size:13px}

.spook{display:flex;justify-content:space-around;align-items:flex-end;height:96px;margin:0 0 4px}.spook svg{height:100%;width:auto;overflow:visible}
.sk .arm{transform-origin:50% 0;transform-box:fill-box;animation:arm .8s ease-in-out infinite alternate}.sk .arm.r{animation-delay:-.4s}
.sk .leg{transform-origin:50% 0;transform-box:fill-box;animation:leg .8s ease-in-out infinite alternate}.sk .leg.r{animation-delay:-.4s}.sk .bod{animation:bob .4s ease-in-out infinite alternate}
@keyframes arm{from{transform:rotate(-55deg)}to{transform:rotate(40deg)}}@keyframes leg{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}@keyframes bob{to{transform:translateY(-4px)}}
.cat .tail{transform-origin:0% 90%;transform-box:fill-box;animation:tail 2.2s ease-in-out infinite alternate}.cat .back{transform-origin:50% 100%;transform-box:fill-box;animation:arch 3.4s ease-in-out infinite}@keyframes tail{from{transform:rotate(-12deg)}to{transform:rotate(16deg)}}@keyframes arch{0%,70%,100%{transform:none}80%,90%{transform:translateY(-4px) scaleY(1.06)}}
.cat .eye{animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}.cat .eye{transform-origin:center;transform-box:fill-box;filter:drop-shadow(0 0 3px #b6ff3a)}
.pk .glow{animation:flick 1.3s infinite}@keyframes flick{0%,100%{opacity:1}20%{opacity:.75}35%{opacity:.95}50%{opacity:.6}70%{opacity:.9}}.pk{filter:drop-shadow(0 0 10px #ff7a1a66)}
#leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.app{position:relative;z-index:1}
.lf{position:absolute;top:-40px;width:22px;height:22px;animation:fall linear infinite}@keyframes fall{0%{transform:translate(0,-40px) rotate(0)}50%{transform:translate(40px,50vh) rotate(200deg)}100%{transform:translate(-20px,105vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){.sk *,.cat *,.pk *,.lf{animation:none!important}#leaves{display:none}}

for(let i=0;i<9;i++){const d=document.createElement('div');d.className='lf';const c=C[i%C.length];d.innerHTML=`<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 2c3 4 9 5 9 11c-3-1-5 0-6 2c1 2 0 5-3 7c-3-2-4-5-3-7c-1-2-3-3-6-2c0-6 6-7 9-11z" fill="${c}" opacity=".85"/><path d="M12 6v16" stroke="#5a1a05" stroke-width="1"/></svg>`;
 d.style.left=(Math.random()*95)+'%';d.style.animationDuration=(10+Math.random()*10)+'s';d.style.animationDelay=(-Math.random()*20)+'s';const s=14+Math.random()*14;d.style.width=d.style.height=s+'px';L.appendChild(d)}})();</script>

 catch(e){const c=JSON.parse(localStorage.getItem(KC)||'null');if(c&&c.zip===zip){render(c.g,c.w,c.al,c.t);$('out').insertAdjacentHTML('afterbegin','<p class="msg err">Offline — showing last saved weather.</p>')}else $('out').innerHTML='<p class="msg err">'+esc(e.message||'Something went wrong')+'. Check it and try again.</p>'}}
function render(g,w,al,t){const c=w.current,d=w.daily,h=w.hourly,[cn,ck]=W[c.weather_code]||['—','cloud'];let H='';
 (al&&al.features||[]).forEach(f=>{const p=f.properties;H+=`<div class="alert ${/Severe|Extreme/.test(p.severity)?'sev':''}"><b>Alert: ${esc(p.event)}</b><span class="sub">${esc(p.headline||'')}</span><details><summary>Details</summary>${esc((p.description||'')+(p.instruction?'\n\n'+p.instruction:''))}</details></div>`});
 H+=`<div class="card"><div class="place">${esc(g.name)}</div><div class="upd">${w.timezone&&w.timezone!==Intl.DateTimeFormat().resolvedOptions().timeZone?'Local time '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',timeZone:w.timezone})+' · ':''}Updated ${new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div>
 <div class="now"><div class="ic">${ic(ck,!c.is_day)}</div><div><div class="big">${Math.round(c.temperature_2m)}°</div><div class="cond">${cn}</div><div class="sub">Feels like ${Math.round(c.apparent_temperature)}° · H ${Math.round(d.temperature_2m_max[0])}° L ${Math.round(d.temperature_2m_min[0])}°</div></div></div>
 <div class="grid"><div><b>${Math.round(c.wind_speed_10m)} mph</b><span>Wind${c.wind_gusts_10m>c.wind_speed_10m+5?' · gusts '+Math.round(c.wind_gusts_10m):''}</span></div><div><b>${c.relative_humidity_2m}%</b><span>Humidity</span></div><div><b>${d.precipitation_probability_max[0]??0}%</b><span>Rain chance</span></div></div></div>`;
 const now=Date.now();const off=(w.utc_offset_seconds||0)*1000,lnow=now+off;let i0=h.time.findIndex(x=>Date.parse(x+'Z')>lnow-36e5);if(i0<0)i0=0;
 H+='<div class="card"><h2>Next 24 hours</h2><div class="hours">';for(let i=i0;i<i0+24&&i<h.time.length;i++){const[,k]=W[h.weather_code[i]]||['','cloud'];H+=`<div class="h"><small>${i===i0?'Now':new Date(h.time[i]).toLocaleTimeString([], {hour:'numeric'})}</small>${ic(k,!h.is_day[i])}<b>${Math.round(h.temperature_2m[i])}°</b><small class="rp">${h.precipitation_probability[i]?h.precipitation_probability[i]+'%':'&nbsp;'}</small></div>`}H+='</div></div>';
 const lo=Math.min(...d.temperature_2m_min),hi=Math.max(...d.temperature_2m_max),sp=hi-lo||1;
 H+='<div class="card"><h2>7-day forecast</h2>';d.time.forEach((x,i)=>{const[nm,k]=W[d.weather_code[i]]||['','cloud'];const a=(d.temperature_2m_min[i]-lo)/sp*100,b=(d.temperature_2m_max[i]-lo)/sp*100;
  H+=`<div class="d"><b>${i===0?'Today':new Date(x+'T12:00').toLocaleDateString([], {weekday:'short'})}</b><span title="${nm}">${ic(k)}</span><span class="rp">${d.precipitation_probability_max[i]?d.precipitation_probability_max[i]+'%':''}</span><div><div class="rng"><span>${Math.round(d.temperature_2m_min[i])}°</span><b>${Math.round(d.temperature_2m_max[i])}°</b></div><div class="bar"><i style="left:${a}%;right:${100-b}%"></i></div></div></div>`});H+='</div>';
 H+=`<div class="card sun"><div><span class="sub">Sunrise</span><b>${tm(d.sunrise[0])}</b></div><div><span class="sub">Sunset</span><b>${tm(d.sunset[0])}</b></div><div><span class="sub">UV max</span><b>${Math.round(d.uv_index_max[0]??0)}</b></div></div>`;
 $('out').innerHTML=H;if(window.onLoaded)onLoaded(curZip,g,w)}
const ST={AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'District of Columbia',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',PR:'Puerto Rico'},AB=Object.fromEntries(Object.entries(ST).map(([k,v])=>[v.toLowerCase(),k]));
const isUS=r=>r.country_code==='US';const lab=r=>{if(isUS(r)){const s=AB[(r.admin1||'').toLowerCase()];return r.name+(s?', '+s:'')}return [r.name,r.admin1&&r.admin1!==r.name?r.admin1:'',r.country].filter(Boolean).join(', ')};
const keyOf=r=>'geo:'+(+r.latitude).toFixed(4)+','+(+r.longitude).toFixed(4)+'|'+(isUS(r)?lab(r):r.name+', '+(r.country||''))+'|'+(r.country_code||'');
async function city(q){let [nm,...rest]=q.split(',').map(s=>s.trim());const st=(rest.join(' ')||'').trim(),stU=st.toUpperCase(),usSt=ST[stU]||(AB[st.toLowerCase()]?st:'');
 const go=async n=>{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=25&language=en&format=json&name='+encodeURIComponent(n));const j=await r.json();return j.results||[]};
 let R=await go(nm);if(/^st\.?\s/i.test(nm)){const R2=await go(nm.replace(/^st\.?\s/i,'Saint '));R=R2.concat(R)}
 R=[...new Map(R.map(r=>[r.id,r])).values()];
 if(st){const s=st.toLowerCase();if(usSt)R=R.filter(r=>isUS(r)&&(r.admin1||'').toLowerCase()===usSt.toLowerCase());else R=R.filter(r=>(r.admin1||'').toLowerCase().startsWith(s)||(r.country||'').toLowerCase().startsWith(s)||(r.country_code||'').toLowerCase()===s)}
 return R}
function pick(R){$('out').innerHTML='<div class="card"><h2>Which one?</h2><div class="picks"></div></div>';const P=$('out').querySelector('.picks');
 R.slice(0,8).forEach(r=>{const k=keyOf(r),b=document.createElement('button');b.type='button';b.className='pickb';b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=lab(r)+(isUS(r)?', United States':'');b.querySelector('small').textContent=[r.admin2,r.population?(r.population.toLocaleString()+' people'):''].filter(Boolean).join(' · ');b.onclick=()=>choose(k);P.appendChild(b)})}
function choose(k){$('zip').value=k.split('|')[1];localStorage.setItem(K,k);load(k)}
$('f').onsubmit=async e=>{e.preventDefault();const z=$('zip').value.trim();$('zip').blur();if(!z)return;
 if(/^\d{5}$/.test(z)){localStorage.setItem(K,z);load(z);return}
 if(/^\d+$/.test(z)){$('out').innerHTML='<p class="msg err">Please enter a 5-digit ZIP code or a city name.</p>';return}
 $('out').innerHTML='<p class="msg">Looking up '+esc(z)+'…</p>';
 try{const R=await city(z);if(!R.length){$('out').innerHTML='<p class="msg err">Couldn\'t find “'+esc(z)+'”. Try adding the state or country, like “Fort Worth, TX” or “Paris, France”.</p>';return}
  const qn=z.split(',')[0].trim().toLowerCase(),top=R.filter(r=>{const n=r.name.toLowerCase();return n===qn||n===qn.replace(/^st\.?\s/,'saint ')||n.replace(/^saint /,'st. ')===qn});const base=top.length?top:R;const uniq=[...new Map(base.map(r=>[lab(r),r])).values()];
  if(uniq.length===1||(z.includes(',')&&new Set(base.map(r=>r.admin1+r.country_code)).size===1))choose(keyOf(base[0]));else pick(uniq)}
 catch(err){$('out').innerHTML='<p class="msg err">Search is unavailable right now. Try a ZIP code.</p>'}};

const KL='aw.locs';let LOC=JSON.parse(localStorage.getItem(KL)||'null'),edit=false,curZ=null,curG=null;
if(!LOC){LOC=[];const z=localStorage.getItem(K);if(z)LOC.push({zip:z});localStorage.setItem(KL,JSON.stringify(LOC))}
const saveL=()=>localStorage.setItem(KL,JSON.stringify(LOC));
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="currentColor"/></svg>',STARO=STAR.replace('fill="currentColor"','fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"');
function chips(){const L=$('locs');L.innerHTML='';$('lhead').hidden=!LOC.length;$('ledit').textContent=edit?'Done':'Edit';
 LOC.forEach((l,i)=>{const c=document.createElement('div');c.className='chip'+(l.zip===curZ?' on':'');c.setAttribute('role','button');c.tabIndex=0;
  c.innerHTML=`<b></b><small></small><span class="t">${l.temp!=null?Math.round(l.temp)+'°':''}</span>`;c.querySelector('b').textContent=(l.nick||l.name||(l.zip.split('|')[1]||l.zip));if(i===0)c.querySelector('b').insertAdjacentHTML('beforeend','<span class="def" title="Default">'+STAR+'</span>');
  c.querySelector('small').textContent=l.nick?(l.name||''):(i===0?'Default':(/^\d{5}$/.test(l.zip)?l.zip:''));
  if(edit){const e=document.createElement('div');e.className='ed';e.innerHTML=(i>0?'<button data-a="up" type="button">&#8592;</button><button data-a="def" type="button">Default</button>':'')+(i<LOC.length-1?'<button data-a="dn" type="button">&#8594;</button>':'')+'<button data-a="nick" type="button">Name</button><button data-a="del" class="del" type="button">Delete</button>';
   e.onclick=ev=>{ev.stopPropagation();const a=ev.target.dataset.a;if(!a)return;
    if(a==='up'){[LOC[i-1],LOC[i]]=[LOC[i],LOC[i-1]]}else if(a==='dn'){[LOC[i+1],LOC[i]]=[LOC[i],LOC[i+1]]}else if(a==='def'){LOC.unshift(LOC.splice(i,1)[0])}
    else if(a==='nick'){const n=prompt('Nickname for '+(l.name||l.zip)+' (e.g. Home, Grandma). Leave blank to clear:',l.nick||'');if(n===null)return;l.nick=n.trim().slice(0,20)}
    else if(a==='del'){if(!confirm('Delete '+(l.nick||l.name||l.zip)+' from your places?'))return;LOC.splice(i,1)}saveL();chips();sbtn()};c.appendChild(e)}
  c.onclick=()=>{if(edit)return;$('zip').value=l.zip.startsWith('geo:')?l.zip.split('|')[1]:l.zip;localStorage.setItem(K,l.zip);load(l.zip)};c.onkeydown=e=>{if(e.key==='Enter')c.click()};L.appendChild(c)})}
function sbtn(){const b=$('savebtn');if(!b)return;const s=LOC.some(l=>l.zip===curZ);b.className='savebtn'+(s?' saved':'');b.innerHTML=(s?STAR+'Saved':STARO+'Save location')}
function onLoaded(zip,g,w){curZ=zip;curG=g;const l=LOC.find(x=>x.zip===zip);if(l){l.name=g.name;l.lat=g.lat;l.lon=g.lon;l.temp=w.current.temperature_2m;l.t=Date.now();saveL()}
 const pl=document.querySelector('#out .place');if(pl&&!$('savebtn')){pl.insertAdjacentHTML('afterend','<button class="savebtn" id="savebtn" type="button"></button>');$('savebtn').onclick=()=>{const i=LOC.findIndex(x=>x.zip===curZ);
  if(i>=0){if(!confirm('Remove '+(LOC[i].nick||LOC[i].name)+' from your places?'))return;LOC.splice(i,1)}else LOC.push({zip:curZ,name:curG.name,lat:curG.lat,lon:curG.lon,temp:w.current.temperature_2m,t:Date.now()});saveL();chips();sbtn()}}
 sbtn();chips()}
$('ledit').onclick=()=>{edit=!edit;chips()};
async function temps(){const s=LOC.filter(l=>l.lat!=null&&(!l.t||Date.now()-l.t>6e5));if(!s.length)return;try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.map(l=>l.lat).join(',')}&longitude=${s.map(l=>l.lon).join(',')}&current=temperature_2m&temperature_unit=fahrenheit`);const j=await r.json();const a=Array.isArray(j)?j:[j];a.forEach((x,i)=>{s[i].temp=x.current.temperature_2m;s[i].t=Date.now()});saveL();chips()}catch(e){}}
chips();temps();
window.onLoaded=onLoaded;
const z0=(LOC[0]&&LOC[0].zip)||localStorage.getItem(K);if(z0){$('zip').value=z0.startsWith('geo:')?z0.split('|')[1]:z0;localStorage.setItem(K,z0);load(z0)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&localStorage.getItem(K)){greet();const c=JSON.parse(localStorage.getItem(KC)||'null');if(!c||Date.now()-c.t>6e5)load(localStorage.getItem(K))}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/weather/sw.js',{scope:'/weather/'}).catch(()=>{});
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('inst').hidden=true;addEventListener('appinstalled',()=>$('inst').hidden=true);
