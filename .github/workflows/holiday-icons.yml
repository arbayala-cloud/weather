name: Holiday icons
on:
  schedule:
    - cron: '5 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/holiday.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git -c user.name=Brock -c user.email=brock@local commit -am "Holiday icons: auto switch"
            git push
            gh api -X POST repos/${{ github.repository }}/pages/builds || true
          fi
